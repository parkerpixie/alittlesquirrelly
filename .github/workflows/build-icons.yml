name: Generate illustrated app icons
on:
  push:
    paths:
      - "assets/brand-icon.svg"
      - "scripts/build-icons.py"
      - ".github/workflows/build-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python scripts/build-icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons apple-touch-icon.png
          git diff --cached --quiet || (git commit -m "Add installable squirrel PNG icons" && git pull --rebase origin main && git push)
