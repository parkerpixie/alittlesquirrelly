name: Copy the 56 public oracle cards
on:
  push:
    paths:
      - "scripts/sync-oracle.py"
      - "assets/oracle/cards.json"
      - ".github/workflows/sync-oracle.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download from GrizzlyJohn public assets
        run: python scripts/sync-oracle.py
      - name: Commit deck artwork to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/oracle oracle-config.js
          git diff --cached --quiet || (git commit -m "Bundle all 56 oracle cards locally" && git push)
